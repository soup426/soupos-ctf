set timeout=0
set default=0

terminal_input console
terminal_output console

menuentry "soupOS" {
    set gfxpayload=text
    multiboot /boot/kernel.elf
    boot
}

# There is deliberately no framebuffer entry here. gfxpayload does NOT decide:
# a kernel whose multiboot header requests video gets a linear framebuffer
# whatever this says, so the framebuffer build is a separate image entirely
# (make iso-fb). See the note in src/boot.asm.
